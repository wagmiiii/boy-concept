# A designed placeholder (D23, decision D28), not a project. Weddings are the private category: a
# real wedding entry arrives at C-2 with publish_ok set only after the couple has given it, and an
# entry that is unverified and unpermitted renders nothing at all. hero_reel stays off as well, so
# a wedding is never in the showreel carousel (FR-2).
title: "[project title]"
category: Weddings
event_name: "[event name]"
location: "[city]"
video_url: "[video url]"
deliverables:
  - "[deliverable]"
summary: "[one or two sentences on the day and the edit, written at C-10]"
hero_reel: false
publish_ok: false
verified: false
demo: true
sort_order: 30
