name = "boy-concept-spike"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves the Astro build and the API (ARCHITECTURE D17).
# run_worker_first is the mechanism S-1 exists to verify.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# D19: without this an asset miss falls through to the Worker, which answers with JSON.
# web/src/pages/404.astro builds to dist/404.html, which is what this serves.
not_found_handling = "404-page"
