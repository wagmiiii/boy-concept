name = "boy-concept-spike"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves the Astro build and the API (ARCHITECTURE D17).
# run_worker_first is the mechanism S-1 exists to verify.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
